
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bootstrap Project</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyWebsite</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3 shadow">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Hello, Bootstrap!</h1>
                <p class="col-md-8 fs-4">This is a responsive, mobile-first starter template using Bootstrap 5.3.</p>
                <button class="btn btn-primary btn-lg" type="button">Learn More</button>
            </div>
        </div>

        <div class="row text-center">
            <div class="col-md-4">
                <div class="card p-3">
                    <h3>Feature 1</h3>
                    <p>This layout automatically stacks on mobile devices.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h3>Feature 2</h3>
                    <p>Bootstrap makes creating columns incredibly easy.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h3>Feature 3</h3>
                    <p>Everything is responsive and ready to use!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
