<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">My Course Tracker</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="input-group mb-3">
                    <input type="text" id="courseInput" class="form-control" placeholder="Enter Course Name">
                    <button id="addBtn" class="btn btn-success">Add Course</button>
                </div>

                <ul id="courseList" class="list-group">
                    <!-- Items yahan add honge -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        let addBtn = document.querySelector("#addBtn");
        let courseList = document.querySelector("#courseList");

        addBtn.addEventListener("click", () => {
            let input = document.querySelector("#courseInput");
            if(input.value === "") return;

            let li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
                <span class="course-text">${input.value}</span>
                <div>
                    <button class="btn btn-warning btn-sm me-2" onclick="editCourse(this)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="removeCourse(this)">Remove</button>
                </div>
            `;
            
            courseList.appendChild(li);
            input.value = ""; 
        });

        // Remove Function
        function removeCourse(btn) {
            btn.parentElement.parentElement.remove();
        }

        // Edit Function
        function editCourse(btn) {
            let span = btn.parentElement.previousElementSibling;
            let currentText = span.innerText;
            let newText = prompt("Edit Course Name:", currentText);
            
            if (newText !== null && newText !== "") {
                span.innerText = newText;
            }
        }
    </script>
</body>
</html>
