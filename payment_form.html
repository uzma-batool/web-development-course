<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #edf2f7;
            color: #1f2937;
            padding: 20px;
        }

        form {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 18px;
        }

        h2 {
            margin-bottom: 16px;
            color: #111827;
        }

        p {
            margin-bottom: 16px;
        }

        fieldset {
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
            background: #fafbfc;
        }

        legend {
            font-weight: 700;
            color: #111827;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 14px 16px;
            resize: vertical;
            background: #f8fafc;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="month"],
        input[type="date"],
        select {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            color: #111827;
            background: #f8fafc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="month"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
            background: #ffffff;
        }

        .payment-section {
            background: #f8fafc;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 22px;
            margin-top: 28px;
        }

        .accepted-cards {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .card-logo {
            border-radius: 14px;
            padding: 10px 18px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-size: 0.9rem;
            min-width: 80px;
            text-align: center;
        }

        .card-logo.visa {
            background: #1a237e;
        }

        .card-logo.mastercard {
            background: linear-gradient(135deg, #ff5f00 0%, #f79e1b 100%);
        }

        .card-logo.amex {
            background: #2b6cb0;
        }

        .form-row {
            margin-bottom: 18px;
        }

        .form-row label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .half-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 18px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
<form action="">
    <h1>Payment Form</h1>
    <h2>Contact Information</h2>
    <p>name:* <input type="text" name="name" required></p>
    <fieldset>
    <legend>Gender</legend>
    male <input type="radio" name="gender" value="male">
    female <input type="radio" name="gender" value="female">
</fieldset>
<p>address : <textarea name="address"></textarea></p>
<p>email : <input type="email" name="email" id="email"></p>
<p>pincode : <input type="text" name="pincode" id="pincode"></p>
<section class="payment-section">
    <h2>Payment Information</h2>
    <div class="accepted-cards">
        <span class="card-logo visa">VISA</span>
        <span class="card-logo mastercard">Mastercard</span>
        <span class="card-logo amex">Amex</span>
    </div>

    <div class="form-row">
        <label for="card_type">Card Type</label>
        <select id="card_type" name="card_type" required>
            <option value="">--Select Card Type--</option>
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
        </select>
    </div>

    <div class="form-row">
        <label for="card_number">Card Number *</label>
        <input type="text" id="card_number" name="card_number" maxlength="19" placeholder="1234 5678 9012 3456" required>
    </div>

    <div class="form-row half-row">
        <div>
            <label for="expiry_date">Expiration Date</label>
            <input type="month" id="expiry_date" name="expiry_date" required>
        </div>
        <div>
            <label for="cvv">CVV</label>
            <input type="password" id="cvv" name="cvv" maxlength="4" placeholder="123" required>
        </div>
    </div>
</section>

<input type="submit" value="Pay Now">

</form>
</body>
