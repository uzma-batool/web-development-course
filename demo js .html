<!DOCTYPE html>
<html>
<body>

    <h2>Control Flow Demo</h2>

    <script>
        // 1. Variables (Naming conventions use karte hue)
        let userScore = 85;
        let paymentStatus = "pending"; // 'pending', 'success', ya 'failed'

        console.log("--- If-Else Condition ---");

        // 2. if, else if, else (Conditional Logic)
        if (userScore >= 90) {
            console.log("Grade: A+");
        } else if (userScore >= 80) {
            console.log("Grade: B");
        } else {
            console.log("Grade: Needs Improvement");
        }

        console.log("--- Switch Statement ---");

        // 3. Switch Statement (Multiple conditions ke liye)
        switch (paymentStatus) {
            case "success":
                console.log("Aapki payment ho gayi hai!");
                break;
            case "pending":
                console.log("Payment process ho rahi hai, intezar karein.");
                break;
            case "failed":
                console.log("Payment fail ho gayi, dobara try karein.");
                break;
            default:
                console.log("Status pata nahi chala.");
        }

        // 4. Loops (Control Flow ka hissa)
        console.log("--- Loop Demo ---");
        for (let i = 1; i <= 3; i++) {
            console.log("Attempt number: " + i);
        }
    </script>

</body>
</html>
