
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Hub: Practice & Challenge</title>
    <style>
        /* --- General Page Reset --- */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #0f172a;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .main-subtitle {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
        }

        /* 👑 SECTION CARD WRAPPER */
        .section-card {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 40px; /* Doosre section ke darmiyan gap */
        }

        .section-title {
            color: #1e3a8a;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        /* ======================================================= */
        /* 🛠️ SECTION 1: INTERACTIVE PLAYGROUND STYLES             */
        /* ======================================================= */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .controls button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .controls button:hover { background-color: #1d4ed8; transform: translateY(-2px); }
        .controls button.active { background-color: #10b981; } 

        .flex-parent {
            background-color: #f8fafc;
            border: 3px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px; 
            display: flex;
            flex-direction: row;        
            justify-content: flex-start; 
            align-items: center;
            transition: all 0.4s ease; 
        }

        .child-box {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            width: 90px;
            height: 90px;
            margin: 10px;
            transition: all 0.4s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-box-1 { background: linear-gradient(135deg, #f43f5e, #be123c); } 
        .play-box-2 { background: linear-gradient(135deg, #0ea5e9, #0369a1); } 
        .play-box-3 { background: linear-gradient(135deg, #10b981, #047857); } 
        .play-box-4 { background: linear-gradient(135deg, #a855f7, #7e22ce); } 

        .grow-active { flex-grow: 1; }

        /* ======================================================= */
        /* 🧱 SECTION 2: CHALLENGE GRID STYLES                     */
        /* ======================================================= */
        .challenge-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .challenge-box {
            background-color: #c2410c; 
            color: #ffffff;
            font-weight: 700;
            font-size: 1.3rem;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 75px;
            box-shadow: 0 4px 6px rgba(194, 65, 12, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .challenge-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(194, 65, 12, 0.25);
        }

        .top-row {
            display: flex;
            gap: 16px;
        }
        .top-row .challenge-box { flex: 1; }

        .middle-row { width: 100%; }

        .bottom-nested-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .nested-row {
            display: flex;
            gap: 14px;
        }

        .nested-row .challenge-box {
            flex: 1; 
            min-height: 60px; 
            background-color: #ea580c; 
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(234, 88, 12, 0.1);
        }
    </style>
</head>
<body>

    <h1>Flexbox Master Hub ⚡</h1>
    <p class="main-subtitle">Combining Interactive Practice & Nested Layout Challenge</p>

    <div class="section-card">
        <div class="section-title">01. Interactive Flexbox Playground</div>
        
        <div class="controls">
            <button onclick="changeDirection('row')">↔️ Row (Horizontal)</button>
            <button onclick="changeDirection('column')">↕️ Column (Vertical)</button>
            <button onclick="changeJustify('flex-start')">⬅️ Move Left / Top</button>
            <button onclick="changeJustify('center')">🎯 Move Center</button>
            <button onclick="changeJustify('flex-end')">➡️ Move Right / Bottom</button>
            <button id="growBtn" onclick="toggleGrow()">⚖️ Make Box 2 BIG</button>
        </div>

        <div class="flex-parent" id="parentContainer">
            <div class="child-box play-box-1">Box 1</div>
            <div class="child-box play-box-2" id="boxTwo">Box 2</div>
            <div class="child-box play-box-3">Box 3</div>
            <div class="child-box play-box-4">Box 4</div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title">02. uzma premium Layout Challenge</div>
        
        <div class="challenge-container">
            <div class="top-row">
                <div class="challenge-box">Box 1</div>
                <div class="challenge-box">Box 2</div>
            </div>

            <div class="middle-row">
                <div class="challenge-box">Box 3</div>
            </div>

            <div class="bottom-nested-grid">
                <div class="nested-row"><div class="challenge-box">Item 1</div></div>
                
                <div class="nested-row">
                    <div class="challenge-box">Item 1</div>
                    <div class="challenge-box">Item 2</div>
                    <div class="challenge-box">Item 3</div>
                </div>
                
                <div class="nested-row">
                    <div class="challenge-box">Item 1</div>
                    <div class="challenge-box">Item 2</div>
                    <div class="challenge-box">Item 3</div>
                    <div class="challenge-box">Item 4</div>
                </div>

                <div class="nested-row">
                    <div class="challenge-box">Item 1</div>
                    <div class="challenge-box">Item 2</div>
                    <div class="challenge-box">Item 3</div>
                    <div class="challenge-box">Item 4</div>
                    <div class="challenge-box">Item 5</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('parentContainer');
        const boxTwo = document.getElementById('boxTwo');
        const growBtn = document.getElementById('growBtn');

        function changeDirection(dir) {
            container.style.flexDirection = dir;
            if (dir === 'column') {
                container.style.alignItems = container.style.justifyContent === 'flex-end' ? 'flex-end' : (container.style.justifyContent === 'center' ? 'center' : 'flex-start');
            } else {
                container.style.alignItems = 'center';
            }
        }

        function changeJustify(pos) {
            container.style.justifyContent = pos;
            if (container.style.flexDirection === 'column') {
                container.style.alignItems = pos;
            }
        }

        function toggleGrow() {
            boxTwo.classList.toggle('grow-active');
            growBtn.classList.toggle('active');
        }
    </script>

</body>
</html>
