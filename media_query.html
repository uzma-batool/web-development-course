<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query Example</title>
    <style>
        html{
            font-size: 1em;
        }
        @media screen and (min-width: 400px) and (max-width: 600px) and (orientation: landscape) {
            p[data-responsive="true"] {
                color: red;
            }
        }
    </style>
</head>
<body>
    <p data-responsive="true">This text will turn red when the screen is landscape and the width is between 400px and 600px.</p>
</body>
</html>
